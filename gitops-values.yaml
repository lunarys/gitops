# Repository-wide facts and conventions.
#
# Read by every chart that needs them -- 03_apps_bootstrap, 04_apps_generator
# and 06_apps_kargo -- and always passed with `-f`, never read via .Files. It
# therefore lives at the repository root, outside every chart, and is
# referenced by path: from the worktree locally, or from a promotion's clone
# as ./src/gitops-values.yaml.
#
# Deliberately NOT a symlink into each chart. Helm does follow symlinks (for
# both -f and .Files.Get, and helm package embeds the target), but the link
# dangles the moment a chart is copied without its parent -- which is exactly
# what render.sh and the promotion's copy step do. `helm template` then fails
# outright with "error evaluating symlink".

# -- The git repository holding both the authored sources and the rendered
# manifests.
mainRepo: https://github.com/lunarys/gitops.git

# -- Branch the Warehouses watch for source changes.
sourceBranch: main

# -- Branch prefix the rendered manifests are committed to (stage/test, stage/prod).
renderedBranchPrefix: stage/

# -- Branch prefix for the pull request a promotion opens against a stage
# branch: <prefix><stage>, one fixed branch per Stage, force-pushed.
#
# Kargo's own namespace for generated promotion branches, reused deliberately
# and without colliding with it: a generated name is that of a Promotion, which
# always carries a freight and a suffix beyond the Stage name.
#
# Repository-wide rather than 06's own, unlike appsDir: this names a branch
# namespace in the shared repository rather than a path inside a chart, and the
# per-app promotion task will push into the same namespace.
promotionBranchPrefix: kargo/promotion/

# -- Path of the app tree within mainRepo.
#
# The layout on disk, which is not the layout the generator renders from: the
# tree is copied into the generator chart before every render. Kargo filters
# Freight by repository path, so Warehouse includePaths must describe this one.
# The assembled location is `appsDir`, and it belongs to whoever assembles it
# -- 06_apps_kargo and render.sh -- not here.
appRoot: 05_apps

# -- Path of the generator chart within mainRepo. 06_apps_kargo renders it and
# copies the app tree into it.
generatorRoot: 04_apps_generator

# -- Root of the generated tree on a stage branch. Everything below it is
# machine-written; anything beside it is not.
#
# The prefix is what makes the location unambiguous regardless of where the
# stage branch is cut from: a branch descending from main carries the authored
# tree too, so a bare `apps/` would sit alongside 05_apps with nothing marking
# which is which.
#
# Apps render to <renderedRoot>/<renderedAppsDir>/<application name> -- the
# name, not the directory, consistent with the directory only ever feeding
# includePaths. Nesting under apps/ also makes a collision between an app and a
# generated directory structurally impossible, rather than a naming rule that
# has to be remembered.
renderedRoot: _rendered

# -- Subdirectories of renderedRoot.
#
# The two generated ones are named after the Stage that writes them, so a
# directory on a stage branch says which Stage produced it. They are also the
# names of the Argo CD Applications that reconcile them: one string, so the
# Stage, the directory it writes and the Application reading it cannot drift.
renderedAppsDir: apps
renderedArgoDir: argo-resources
renderedKargoDir: kargo-resources

# -- Private companion repository.
#
# Not yet migrated to the Kargo flow; retained so the existing private
# app-of-apps keeps working. The per-app `privateSettings` merge is gone -- no
# app in 05_apps used it.
privateRepo: https://github.com/lunarys/gitops-private.git
privateRepoEnabled: true

# -- Kargo control plane.
kargo:
  # Prefix for each app's Kargo Project, and therefore for its namespace.
  #
  # MUST NOT be empty. 22 of 23 app directories deploy into a namespace named
  # after the directory, and a Kargo Project creates a like-named namespace in
  # the same (prod) cluster. Without the prefix the Project namespace and the
  # workload namespace are the same namespace.
  projectPrefix: kargo-app-

  # -- The Kargo Project that renders the generator's output, defined by
  # 06_apps_kargo. Named after the chart it runs (04_apps_generator, chart name
  # apps-generator) rather than after what it produces.
  #
  # Also a namespace: a Kargo Project is cluster-scoped and owns a namespace of
  # its own name, which is where its Warehouse, Stages, Promotions and git
  # credential live. And it prefixes the kargo.akuity.io/authorized-stage
  # annotation (<project>:<stage>) that 03 must put on the Applications these
  # Stages update.
  generatorProject: kargo-apps-generator

  # The shared ClusterPromotionTask every app Stage invokes. Defined by
  # 05_apps/kargo; referenced by the Stages 04_apps_generator emits.
  promotionTask: render-and-open-pr

  # environment -> Kargo controller shard. A Stage runs on the shard of the
  # cluster it changes, so a promotion never half-runs against a cluster that
  # is powered off.
  shards:
    test: test
    prod: prod

# -- Argo CD.
argo:
  # Namespace Argo CD itself runs in, in each cluster. This is where the
  # generated Application and AppProject resources are created -- not where the
  # workloads land, and not the Kargo Project namespace.
  namespace: argocd
  # Destination cluster for every Application. Each cluster's Argo CD deploys
  # into itself, so this is the in-cluster address in both.
  server: https://kubernetes.default.svc
