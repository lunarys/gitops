# Source: kargo/charts/kargo/templates/controller/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kargo-controller
  namespace: kargo
  labels:
    helm.sh/chart: kargo-1.12.3
    app.kubernetes.io/name: kargo
    app.kubernetes.io/instance: kargo
    app.kubernetes.io/version: "v1.12.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: controller
    
  
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kargo
      app.kubernetes.io/instance: kargo
      app.kubernetes.io/component: controller
      
  template:
    metadata:
      labels:
        helm.sh/chart: kargo-1.12.3
        app.kubernetes.io/name: kargo
        app.kubernetes.io/instance: kargo
        app.kubernetes.io/version: "v1.12.3"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: controller
        
      annotations:
        configmap/checksum: 98538e83a93b50c000021473c669a719b8f0a50dfd00875c3350b8684d75d152
    spec:
      serviceAccountName: kargo-controller
      containers:
      - name: controller
        image: ghcr.io/akuity/kargo:v1.12.3
        imagePullPolicy: IfNotPresent
        command: ["/sbin/tini", "--", "/usr/local/bin/kargo"]
        args: ["controller"]
        env:
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              containerName: controller
              divisor: "1"
              resource: limits.memory
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              containerName: controller
              divisor: "1"
              resource: limits.cpu
        envFrom:
        - configMapRef:
            name: kargo-controller
        volumeMounts:
        - mountPath: /tmp
          name: tmp-data
        resources:
          {}
      volumes:
      - name: tmp-data
        emptyDir: {}