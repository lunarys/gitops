# Source: kargo/charts/kargo/templates/controller/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kargo-controller
  namespace: kargo
  labels:
    helm.sh/chart: kargo-1.11.4
    app.kubernetes.io/name: kargo
    app.kubernetes.io/instance: kargo
    app.kubernetes.io/version: "v1.11.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: controller
    
  
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kargo
      app.kubernetes.io/instance: kargo
      app.kubernetes.io/component: controller
      
  template:
    metadata:
      labels:
        helm.sh/chart: kargo-1.11.4
        app.kubernetes.io/name: kargo
        app.kubernetes.io/instance: kargo
        app.kubernetes.io/version: "v1.11.4"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: controller
        
      annotations:
        configmap/checksum: dc4b2a71666ae6e18f1d5a19b544144edb71d3e3e76bfac30211f861ac22b43e
    spec:
      serviceAccountName: kargo-controller
      containers:
      - name: controller
        image: ghcr.io/akuity/kargo:v1.11.4
        imagePullPolicy: IfNotPresent
        command: ["/sbin/tini", "--", "/usr/local/bin/kargo"]
        args: ["controller"]
        env:
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              containerName: controller
              divisor: "1"
              resource: limits.memory
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              containerName: controller
              divisor: "1"
              resource: limits.cpu
        envFrom:
        - configMapRef:
            name: kargo-controller
        volumeMounts:
        - mountPath: /tmp
          name: tmp-data
        resources:
          {}
      volumes:
      - name: tmp-data
        emptyDir: {}