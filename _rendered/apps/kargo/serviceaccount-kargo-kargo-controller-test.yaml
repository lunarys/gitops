# Source: kargo/templates/test-shard-identity.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kargo-controller-test
  namespace: kargo
  labels:
    # The management controller grants Secret read in every Project namespace
    # to ServiceAccounts with this label. Needed even though every credential
    # lives in the shared-resources namespace: Kargo looks in the Project
    # namespace first and aborts on a 403 instead of falling through.
    app.kubernetes.io/component: controller