# The shard's heartbeat Lease, which the UI reads for controller liveness.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-controller-test
  namespace: kargo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kargo-controller
subjects:
  - kind: ServiceAccount
    name: kargo-controller-test
    namespace: kargo