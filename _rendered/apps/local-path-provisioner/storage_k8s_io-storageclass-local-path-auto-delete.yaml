apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-auto-delete
  labels:
    app.kubernetes.io/name: local-path-provisioner
    helm.sh/chart: local-path-provisioner-0.0.36
    app.kubernetes.io/instance: local-path-provisioner
    app.kubernetes.io/version: "v0.0.36"
    app.kubernetes.io/managed-by: Helm
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    defaultVolumeType: "local"
provisioner: cluster.local/local-path-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  pathPattern: "{{ .PVC.Namespace }}/{{ .PVC.Name }}/"