# Source: crowdsec/charts/crowdsec/templates/lapi-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-profiles
data:
  profiles.yaml: |
    name: default_ip_remediation
    #debug: true
    filters:
    - Alert.Remediation == true && Alert.GetScope() == "Ip"
    decisions:
    - type: ban
      duration: 12h
    duration_expr: Sprintf('%dh', 12 * (4 ^ GetDecisionsCount(Alert.GetValue())))
    on_success: break