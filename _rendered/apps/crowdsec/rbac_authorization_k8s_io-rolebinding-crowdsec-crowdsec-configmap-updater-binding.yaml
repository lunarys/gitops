apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: crowdsec
  name: crowdsec-configmap-updater-binding
  labels:
    k8s-app: crowdsec
    type: capi-register-job
    version: v1
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-1"
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: crowdsec-configmap-updater-role
subjects:
  - kind: ServiceAccount
    name: crowdsec-configmap-updater-sa
    namespace: crowdsec