# Source: longhorn/charts/externalsecrets/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cifs-secret
spec:
  target:
    name: cifs-secret
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        CIFS_PASSWORD: |-
          {{ index . "CIFS_PASSWORD" }}
        CIFS_USERNAME: |-
          {{ index . "CIFS_USERNAME" }}
  data:
    - secretKey: CIFS_PASSWORD
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 33df0a50-c169-4242-97c2-b33b00dbe4ca
        property: password
    - secretKey: CIFS_USERNAME
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 33df0a50-c169-4242-97c2-b33b00dbe4ca
        property: username