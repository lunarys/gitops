externalsecrets:
  secrets:
    # Consumed through api.secret.name, so Helm renders neither value. The keys
    # are Kargo's, not ours: the API server reads exactly these two names.
    kargo-api-credentials:
      commonRemoteKey: "cb51f598-1312-49b4-828f-b4be00c969e9"
      fields:
        ADMIN_ACCOUNT_PASSWORD_HASH:
          storeRefName: bitwarden-fields
          remoteProperty: password_hash
        ADMIN_ACCOUNT_TOKEN_SIGNING_KEY:
          storeRefName: bitwarden-fields
          remoteProperty: signing_key
