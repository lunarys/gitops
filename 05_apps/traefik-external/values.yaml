global:
  checkNewVersion: false
  sendAnonymousUsage: false

ingress:
  enabled: false  # dashboard disabled in production; enabled in values-test.yaml
  host: ""

traefik:
  deployment: 
    replicas: 2
    podLabels:
      custom.network/external-ingress: egress

  ingressClass:
    isDefaultClass: false
    name: traefik-external

  ports:
    traefik:
      expose:
        default: false  # API port not exposed via Service in production
    web:
      nodePort: 31255
      http:
        middlewares:
          - "traefik-common-rate-limit@kubernetescrd"
          - "traefik-common-crowdsec-bouncer@kubernetescrd"
          - "traefik-common-region-allowlist@kubernetescrd" # deliberately set geoblock after crowdsec to observe what crowdsec is doing
          - "traefik-common-security-headers@kubernetescrd"
    websecure:
      nodePort: 31060
      http:
        middlewares:
          - "traefik-common-rate-limit@kubernetescrd"
          - "traefik-common-crowdsec-bouncer@kubernetescrd"
          - "traefik-common-region-allowlist@kubernetescrd"
          - "traefik-common-security-headers@kubernetescrd"

  service:
    labels:
      custom.network/lb-pool: static
    annotations:
      lbipam.cilium.io/ips: "10.0.4.201"
    spec: 
      allocateLoadBalancerNodePorts: true

  ingressRoute:
    dashboard:
      enabled: false

  api:
    dashboard: false  # enabled in values-test.yaml
    insecure: false

  experimental:
    plugins:
      crowdsec-bouncer-traefik-plugin:
        moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
        version: v1.5.1
      geoblock:
        moduleName: "github.com/PascalMinder/geoblock"
        version: v0.3.7  # TODO: update mechanism

  volumes:
    - name: crowdsec-bouncer-key
      mountPath: /mnt/crowdsec
      type: secret

  providers:
    kubernetesCRD:
      # this is required to configure traefik based on its crds, e.g. also Middlewares
      enabled: true

    kubernetesIngress:
      enabled: true
      ingressClass: traefik-external
      publishedService:
        enabled: true  # required for argo to not show ingresses as progressing

  log:
    level: INFO
    format: json
    
  accessLog:
    enabled: true
    format: json      

autoscale:
  enabled: false
