---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: <TODO>
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: <TODO>
spec:
  promotionPolicies:
    # Nothing auto-promotes. For test that is a requirement: the cluster is off
    # much of the time, and promotions to it would otherwise queue against a
    # controller that is not running.
    - stageSelector:
        name: argo-resources-test
      autoPromotionEnabled: false
    - stageSelector:
        name: argo-resources-prod
      autoPromotionEnabled: false
    # Kargo resources are only reconciled by the prod controller,
    # which runs the Kargo control plane.
    # The test cluster is only an "agent".
    - stageSelector:
        name: kargo-resources-prod
      autoPromotionEnabled: false
